name: Publish Images to GHCR

# Builds and pushes the single combined image on every push to main.
# Mirrors the publish workflow in mateuseap/pixelhub.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mateuseap/mixtape:latest
            ghcr.io/mateuseap/mixtape:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
