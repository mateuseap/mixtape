<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Mixtape: an MP3 click wheel and a CD player, interactive 3D sound equipment">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0f7a63" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f7a63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="360" fill="#f4f7f6"/>
  <rect width="720" height="360" fill="url(#glow)"/>

  <!-- faint orbiting node grid, abstract sound-equipment motif -->
  <g stroke="#dfe7e3" stroke-width="1.4" fill="none">
    <circle cx="360" cy="150" r="110"/>
    <circle cx="360" cy="150" r="150"/>
  </g>
  <g fill="#35d0a5" opacity="0.5">
    <circle cx="360" cy="40" r="3.5"/>
    <circle cx="250" cy="72" r="3.5"/>
    <circle cx="470" cy="72" r="3.5"/>
    <circle cx="210" cy="150" r="3.5"/>
    <circle cx="510" cy="150" r="3.5"/>
    <circle cx="250" cy="228" r="3.5"/>
    <circle cx="470" cy="228" r="3.5"/>
    <circle cx="360" cy="260" r="3.5"/>
  </g>

  <!-- the real brand mark, scaled up: click wheel ring + four zone dots -->
  <g transform="translate(300,90)">
    <rect width="120" height="120" rx="28" fill="#0c1a14"/>
    <circle cx="60" cy="60" r="32" fill="none" stroke="#35d0a5" stroke-width="5.5"/>
    <circle cx="60" cy="60" r="13" fill="#35d0a5"/>
    <circle cx="60" cy="28" r="5" fill="#35d0a5"/>
    <circle cx="60" cy="92" r="5" fill="#35d0a5"/>
    <circle cx="28" cy="60" r="5" fill="#35d0a5"/>
    <circle cx="92" cy="60" r="5" fill="#35d0a5"/>
  </g>

  <text x="360" y="272" font-family="Geist, system-ui, sans-serif" font-size="34" font-weight="700" fill="#131d1a" text-anchor="middle">mixtape</text>
  <text x="360" y="300" font-family="Geist Mono, ui-monospace, monospace" font-size="14" letter-spacing="1" fill="#5c6b66" text-anchor="middle">YOUR MP3S &#183; YOUR SERVER</text>
</svg>
