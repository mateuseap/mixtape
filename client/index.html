<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mixtape</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">m</span>
        <div class="brand-text">
          <span class="brand-word">mixtape</span>
          <span class="brand-sub">MP3 PLAYER</span>
        </div>
      </div>
      <div class="nav-actions">
        <button id="add-track-btn" class="icon-btn" type="button" aria-label="Add a track">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>ADD A TRACK</span>
        </button>
        <input id="file-input" type="file" accept="audio/mpeg,.mp3" hidden />
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow">
        <span class="eyebrow-rule" aria-hidden="true"></span>
        <span>3D MP3 PLAYER</span>
      </div>
      <h1 class="headline">Your music.<br />Made real.</h1>
      <div class="status-pill">
        <span class="status-dot" aria-hidden="true"></span>
        OPEN LIBRARY &middot; ANYONE ADDS
      </div>
    </section>

    <section class="stage">
      <div class="mode-card">
        <span class="mode-label">MODE</span>
        <div class="mode-toggles">
          <button id="shuffle-toggle" class="mode-btn" type="button" title="Shuffle: off (click to turn on)">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5h3.5a3 3 0 0 1 2.4 1.2L16.5 15a3 3 0 0 0 2.4 1.2H21" />
              <path d="M4 15h3.5a3 3 0 0 0 2.4-1.2l.4-.5" />
              <path d="M17 4l3 3-3 3" />
              <path d="M17 18l3-3-3-3" />
            </svg>
            <span class="mode-btn-label">Shuffle</span>
          </button>
          <button id="repeat-toggle" class="mode-btn" type="button" title="Repeat: off (click to repeat all)">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h13a3 3 0 0 1 3 3v2" />
              <path d="M17 4l3 3-3 3" />
              <path d="M20 17H7a3 3 0 0 1-3-3v-2" />
              <path d="M7 20l-3-3 3-3" />
            </svg>
            <span class="mode-badge" aria-hidden="true">1</span>
            <span class="mode-btn-label">Repeat</span>
          </button>
        </div>
      </div>

      <div class="device-stage">
        <canvas id="device-canvas"></canvas>
      </div>

      <button id="reset-view" class="reset-btn" type="button" title="Reset the device to its default angle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"></path>
          <path d="M3 4v5h5"></path>
        </svg>
        <span>RESET VIEW</span>
      </button>
    </section>

    <p class="drag-hint"><span aria-hidden="true">&larr;</span> &#x1f91a; DRAG TO ROTATE &middot; CLICK CENTER TO PLAY <span aria-hidden="true">&rarr;</span></p>

    <section class="player-bar-wrap">
      <div class="player-bar" id="player-bar"></div>
    </section>

    <section class="library">
      <div class="library-header">
        <span class="eyebrow-rule" aria-hidden="true"></span>
        <span class="section-label">CHOOSE A TRACK</span>
        <span class="eyebrow-rule" aria-hidden="true"></span>
      </div>
      <div class="track-row-wrap">
        <button class="scroll-btn scroll-left" id="scroll-left" type="button" aria-label="Scroll left">&lsaquo;</button>
        <div class="track-row" id="track-row"></div>
        <button class="scroll-btn scroll-right" id="scroll-right" type="button" aria-label="Scroll right">&rsaquo;</button>
      </div>
    </section>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
